version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: consultation_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - consultation_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consultation_booking"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - consultation_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/sites-available:/etc/nginx/sites-available
    networks:
      - consultation_network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile.dev
    container_name: user-service-dev
    environment:
      - USER_SERVICE_DSN=host=postgres user=postgres password=password123 dbname=consultation_booking port=5432 sslmode=disable
      - JWT_SECRET=your-secret
      - BOOKING_SERVICE_URL=http://booking-service:8082
      - GO_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # Mount toàn bộ source code
      - ./services/user-service:/app
      # Tạo named volume cho Go modules cache
      - go_mod_cache_user:/go/pkg/mod
    networks:
      - consultation_network

  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile.dev
    container_name: booking-service-dev
    environment:
      - BOOKING_SERVICE_DSN=host=postgres user=postgres password=password123 dbname=consultation_booking port=5432 sslmode=disable
      - JWT_SECRET=your-secret
      - REDIS_URL=redis://:redis_password_123@redis:6379/0
      - PORT=8082
      - GO_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8082:8082"
    volumes:
      # Mount toàn bộ source code
      - ./services/booking-service:/app
      # Tạo named volume cho Go modules cache
      - go_mod_cache_booking:/go/pkg/mod
    networks:
      - consultation_network
    # Thêm tty để có thể thấy output realtime
    tty: true
    stdin_open: true

  expert-service:
    build:
      context: ./services/expert-service
      dockerfile: Dockerfile.dev
    container_name: expert-service-dev
    environment:
      - EXPERT_SERVICE_DSN=host=postgres user=postgres password=password123 dbname=consultation_booking port=5432 sslmode=disable
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=redis_password_123
      - PORT=8083
      - JWT_SECRET=your-secret
      - GO_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8083:8083"
    volumes:
      - ./services/expert-service:/app
      - go_mod_cache_expert:/go/pkg/mod
    networks:
      - consultation_network
    tty: true
    stdin_open: true

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile.dev
    container_name: api-gateway-dev
    environment:
      - USER_SERVICE_URL=http://user-service:8080
      - BOOKING_SERVICE_URL=http://booking-service:8082
      - EXPERT_SERVICE_URL=http://expert-service:8083
      - JWT_SECRET=your-secret
      - GO_ENV=development
    depends_on:
      - user-service
      - booking-service
      - expert-service
    ports:
      - "8081:8081"
    volumes:
      - ./services/api-gateway:/app
      - go_mod_cache_gateway:/go/pkg/mod
    networks:
      - consultation_network

    tty: true
    stdin_open: true

  directus:
    image: directus/directus:11.8.0
    ports:
      - "8055:8055"
    environment:
      KEY: "a-very-secret-key"
      SECRET: "another-secret-key"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "admin123"
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "consultation_booking"
      DB_USER: "postgres"
      DB_PASSWORD: "password123"
      PUBLIC_URL: "http://localhost:8055"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - consultation_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  # Volumes cho Go modules cache
  go_mod_cache_user:
  go_mod_cache_booking:
  go_mod_cache_expert:
  go_mod_cache_gateway:

networks:
  consultation_network:
    driver: bridge