# .air.toml - Cấu hình tối ưu cho Docker
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
  include_file = []
  kill_delay = "2s"
  log = "build-errors.log"
  poll = true  # Bật polling cho Docker
  poll_interval = 500  # Poll interval tăng cho Docker
  rerun = false
  rerun_delay = 500
  send_interrupt = true  # Đảm bảo process được terminate đúng cách
  stop_on_root = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = true  # Bật timestamp để debug

[misc]
  clean_on_exit = true  # Clean up khi exit

[screen]
  clear_on_rebuild = true  # Clear screen khi rebuild
  keep_scroll = false